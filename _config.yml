        description: | # this will include new lines to allow paragraphs
          - Directed production planning and resource scheduling across specialized manufacturing facilities (Machine, CNC, Laser Cladding, and Assembly shops) for over 20 industrial R&D projects.
          - Developed an automated database and reporting pipeline linking MS Access and Excel, delivering real-time shop-floor tracking, capacity visibility, and financial progress dashboards to executive management.
          - Mitigated operational bottlenecks and contractor schedules by translating physical machine constraints and job priorities into actionable production timetables.


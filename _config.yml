about_content: | # this will include new lines to allow paragraphs
  I'm an Operations Research specialist and C/C++ developer based in Ghent, Belgium. I'm a PhD researcher at
  Ghent University & Flanders Make, where I build optimization algorithms for human-centric production scheduling.

  My work focuses on combinatorial optimization, scheduling, exact and decomposition algorithms, metaheuristics,
  and stochastic optimization. I enjoy translating industrial planning and scheduling problems into mathematical
  models and high-performance algorithmic solutions.

  I am most skilled in: <mark>C/C++</mark> <mark>Gurobi</mark> <mark>IBM ILOG CPLEX</mark> <mark>CP Optimizer</mark>
  <mark>Python</mark> <mark>Git</mark> <mark>CMake</mark> <mark>HPC</mark> <mark>Docker</mark>


        link: www.ugent.be
        sub_title: PhD Researcher & Algorithm Developer
        caption: Feb 2022 - Present · Ghent, Belgium
        description: | # this will include new lines to allow paragraphs
          - Architected and implemented high-performance <mark>C++</mark> scheduling engines for human-centric Flexible Job Shop Scheduling (FJSP).
          - Formulated deterministic and stochastic optimization models to address real-world operational uncertainties, workforce side constraints, and dual-resource machine/operator allocation.
          - Implemented exact decomposition schemes (Logic-Based Benders Decomposition, MIP, CP) and local search metaheuristics to improve solution quality and cut runtime on large-scale benchmarks.
          - Developed and implemented algorithms within the collaborative industry project *S4FMS*, building modular C++ and Python APIs to integrate optimization engines into partner architectures and industrial testbeds.
          - Interfaced production-grade mathematical solvers (Gurobi, IBM ILOG CPLEX, CP Optimizer) with custom C++ data structures and graph-based search routines.

      - layout: left
        title: Taha Ghaleb Toos company (TGT Co)
        sub_title: Project Planning and Control Specialist
